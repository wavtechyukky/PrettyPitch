# Recipe: Project AI❤dol Public English Dataset（英語、女声 1 人、57 曲、約 1.76 時間。CC BY-SA 4.0）。
# このデータで学習したモデルを公開するには、歌い手の事前の許可が要る（データセットの規約を参照）。
# 読み方・記号の写像は LeapSinger の configs/recipes/aidol.yaml と同じ（EP = 吐息 → pau、GS = 声門閉鎖 → q、
# vf = ボーカルフライはそのまま）。データは同梱しない（download/aidol/ に wav/ と lab/ を置く）。
#   python -m preprocess.run --recipe configs/recipes/aidol.yaml          # -> data/aidol
# 伸ばしのラベル（音符をまたぐ母音を「ay -」に分けたもの）は tools/hold_labels で作る（configs/en_aidol_notes.yaml）。
# 話者 / スタイル ID はここでは決めない — 学習 config の data.spk_map / style_map が唯一の情報源。
name: aidol
lang: en_full              # 言語パック dict/en_full.yaml（音素表 = LeapSinger の dict/en_full.phonemes と同じ中身）
f0_octave_fix: true
silence_pau: true          # pau を F0 抽出の前に無音化する
silence_fade_sec: 0.05
lab_unit: "100ns"

layout: type_split
db_root: download/aidol
wav_dir: wav
wav: "wav/{song}.wav"
lab: "lab/{song}.lab"

phon_norm:
  "SP": pau
  "AP": pau
  "EP": pau
  "GS": q
  "vf": vf
exclude: []

# ── 学習時の DB 別ハイパラ（ローダーが読む。変えても再 preprocess は要らない）──────────────
reject_f0_below: 100.0     # 女声。声帯のフライや音の消え際で出る低すぎる F0 の句を捨てる

decomp: {}
pitch: {}
duration: {}
