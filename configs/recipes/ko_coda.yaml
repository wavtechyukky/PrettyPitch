# Recipe: Team CODA の表記（dict/ko.yaml）でラベルを付けた韓国語の歌声データ（歌い手 1 人）。
# 読むのは、LeapSinger の tools/convert_labels.py labdir で整えた wav と lab の組（同じフォルダに <名前>.wav・.lab）:
#   2 分を超える音声は休みで 1 分ほどの片に切り（RMVPE のメモリのため）、ラベルの末尾が音声を超えるものは音声の長さで切る。
#   download/ko_coda/ に置く（このリポジトリには入っていない）。
#   python -m preprocess.run --recipe configs/recipes/ko_coda.yaml
# 話者 / スタイル ID はここでは決めない — 学習 config の data.spk_map / style_map が唯一の情報源。
name: ko_coda
lang: ko                   # 言語パック dict/ko.yaml（音素表 = LeapSinger の dict/ko_coda.phonemes と同じ中身）
f0_octave_fix: true
silence_pau: true          # pau を F0 抽出の **前に** 無音化する（息継ぎを有声と誤判定して高い F0 を返すのを防ぐ。男声で特に効く）
silence_fade_sec: 0.05
lab_unit: "100ns"

layout: type_split
db_root: download/ko_coda
wav_dir: "."               # wav と lab が同じフォルダにある
wav: "{song}.wav"
lab: "{song}.lab"

# Team CODA の表記に無い書き間違いの写像（データに合わせて足す。SP・AP・exh・trash は dict/ko.yaml の sil_map が pau にする）
phon_norm:
  "Sp": pau
  "sh": s
  "hh": h
  "R": r
  "O": o
  "D": d
  "ng": NG
  "uu": u
exclude: []

# ── 学習時の DB 別ハイパラ（ローダーが読む。変えても再 preprocess は要らない）──────────────
reject_f0_below: 60.0      # 歌い手の音域より十分低い値（男声なら 60、女声なら 100 が目安）

decomp: {}
pitch: {}
duration: {}
